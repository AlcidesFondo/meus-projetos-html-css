<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'
    />
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img class="profile-image" src="profile.jpg" alt="">
        </div>

        <div class="text-data">
            <span class="name">Alcides Maria</span>
            <span class="job">Desenvolvedor Web & Designer Grafico</span>
        </div>

        <div class="media-buttons">
            <a class="link" style="background: #4267b2 ;" href="#">
                <i class='bx bxl-facebook-circle' ></i>
            </a>
            <a class="link" style="background: #1da1f2;" href="#">
                <i class='bx bxl-twitter' ></i>
            </a>
            <a class="link" style="background: #e1306c;" href="#">
                <i class='bx bxl-instagram' ></i>
            </a>
            <a class="link" style="background: #ff0000;" href="#">
                <i class='bx bxl-youtube'></i>
            </a>
        </div>
        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Message</button>
        </div>

        <div class="analytics">
            <div class="data">
                <i class='bx bx-heart' ></i>
                <span class="class">60k</span>
            </div>
              <div class="data">
                <i class='bx bx-message-rounded'></i>
                <span class="class">20k</span>
            </div>
              <div class="data">
                <i class='bx bx-share'></i>
                <span class="class">12k</span>
            </div>
        </div>
            
    </div>
</body>
</html>
