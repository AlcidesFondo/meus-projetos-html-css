<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel=""
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img class="profile-image" src="profile.jpg" alt="">
        </div>

        <div class="text-data">
            <span class="name">Alcides Maria</span>
            <span class="job">Desenvolvedor Web & Designer Grafico</span>
        </div>

        <div class="media">
            <div class="icon">
                <i class='bx bxl-facebook-circle' ></i>
            </div>
            <div class="icon">
                <i class='bx bxl-twitter' ></i>
            </div>
            <div class="icon">
                <i class='bx bxl-instagram' ></i>
            </div>
            <div class="icon">
                <i class='bx bxl-youtube' ></i>
        </div>
    </div>
</body>
</html>
